name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,sklearn]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest

  examples:
    # Keep the synthetic end-to-end demo alive: a src/predictor change that
    # breaks it fails CI here instead of rotting silently. The ai4i/secom
    # examples download real datasets from the network, so they stay manual.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,sklearn]"
      - name: End-to-end demo runs headless
        run: python examples/end_to_end.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Wheel smoke — install the built wheel clean and import
        run: |
          python -m venv /tmp/ws
          /tmp/ws/bin/pip install "$(ls dist/*.whl)"
          /tmp/ws/bin/python -c "import predictor; print(predictor.__name__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
